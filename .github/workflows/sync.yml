name: roster sync

on:
  schedule:
    # 11:07 UTC = 6:07am CDT (5:07am CST from Nov 1 — GitHub cron is fixed UTC). Deliberately off the
    # top of the hour: GitHub's scheduler is best-effort and delays, or drops, runs at :00 under load.
    - cron: '7 11 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Cheap, and stops a broken commit from posting nonsense to the league channel.
      - name: test
        run: node --test test/sync.test.mjs

      - name: sync
        run: node sync.mjs
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
