name: roster sync

on:
  schedule:
    # 11:00 UTC = 6am CDT. GitHub cron is fixed UTC with no DST, so from Nov 1 this fires at 5am CST.
    - cron: '0 11 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Cheap, and stops a broken commit from posting nonsense to the league channel.
      - name: test
        run: node --test test/sync.test.mjs

      - name: sync
        run: node sync.mjs
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
