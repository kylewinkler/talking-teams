name: lineup advisor

on:
  schedule:
    # 12:37 UTC = 7:37am CDT — after overnight injury news, well before Sunday kickoffs. Off the
    # round minutes, where GitHub's best-effort scheduler delays or drops runs under load.
    - cron: '37 12 * * *'
  workflow_dispatch:

jobs:
  advise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: test
        run: node --test

      - name: advise
        run: node advise.mjs
        env:
          LINEUP_WEBHOOK_URL: ${{ secrets.LINEUP_WEBHOOK_URL }}
